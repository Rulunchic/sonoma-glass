
[bar]
background = "#242428"
background-alpha = 0.32
text = "#f5f5f7"
active = "#ff453a"
scale-with-font = true
size-horizontal = 30
size-vertical = 28

[hyprland]
active-border = "rgba(a9ccffb3) rgba(ffffff60) 135deg"
active-border-foreground = "rgba(a9ccffb3) rgba(ffffff60) 135deg"

[controls]
normal-color = "#f5f5f7"
normal-fill-alpha = 0.04
normal-border = "#f5f5f7"
normal-border-width = 1
normal-border-alpha = 0.4
hover-cursor-color = "#64b5ff"
hover-cursor-fill-alpha = 0.2
hover-cursor-border = "#a9ccff"
hover-cursor-border-width = 1
hover-cursor-border-alpha = 0.68
focus-color = "#64b5ff"
focus-fill-alpha = 0.18
focus-border = "#a9ccff"
focus-border-width = 1
focus-border-alpha = 0.6
selected-color = "#f5f5f7"
selected-fill-alpha = 0.18
selected-border = "#f5f5f7"
selected-border-width = 0
selected-border-alpha = 1.0
pressed-fill-alpha = 0.22
selection-fill-alpha = 0.35

[spacing]
scale = 0.9
scale-with-font = true

[font]
base-size = 12

[popups]
background = "#242428"
background-alpha = 0.32
text = "#f5f5f7"
border = "rgba(ffffff55) rgba(ffffff18) 135deg"
border-alpha = 0.65

[tooltip]
background = "#303034"
background-alpha = 0.7
text = "#f5f5f7"
border = "#ffffff"
border-alpha = 0.16

[notifications]
background = "#242428"
background-alpha = 0.52
text = "#f5f5f7"
border = "rgba(ffffff55) rgba(ffffff18) 135deg"
border-alpha = 0.65
countdown = "#0a84ff"

[launcher]
background = "#242428"
background-alpha = 0.36
text = "#f5f5f7"
border = "rgba(ffffff55) rgba(ffffff18) 135deg"
border-alpha = 0.7
scrim = "#000000"
scrim-alpha = 0.18
selected-background = "#0a84ff"
selected-background-alpha = 0.58
selected-text = "#ffffff"
selected-border = "#64b5ff"
selected-border-alpha = 0.4

[menu]
background = "#242428"
background-alpha = 0.58
text = "#f5f5f7"
border = "rgba(ffffff55) rgba(ffffff18) 135deg"
border-alpha = 0.7
scrim = "#000000"
scrim-alpha = 0.18
selected-background = "#0a84ff"
selected-background-alpha = 0.58
selected-text = "#ffffff"
selected-border = "#64b5ff"
selected-border-alpha = 0.4

[polkit]
background = "#242428"
background-alpha = 0.68
text = "#f5f5f7"
text-error = "#ff453a"
border = "#ffffff"
border-error = "#ff453a"
border-alpha = 0.18
scrim = "#000000"
scrim-alpha = 0.25
accent = "#0a84ff"

[lock]
background = "#242428"
background-alpha = 0.6
text = "#f5f5f7"
placeholder = "#ababad"
text-error = "#ff453a"
border = "#ffffff"
border-active = "#0a84ff"
border-error = "#ff453a"
border-alpha = 0.22
selection = "#0a84ff"
selection-alpha = 0.45

[image-picker]
scrim = "#000000"
scrim-alpha = 0.28
text = "#f5f5f7"
selected-border = "#0a84ff"
selected-border-alpha = 1.0
unselected-border = "#f5f5f7"
unselected-border-alpha = 0.28
